<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSphere - Safety & Emergency Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-orange-400">SafeSphere</h1>
            <p class="text-xs text-slate-400 mt-1">Quick-access emergency tools and safety companion.</p>
        </div>
        
        <!-- Main SOS Emergency Button -->
        <div class="mb-8 text-center">
            <button onclick="triggerSOS()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-rose-600/30 transition text-lg tracking-wide cursor-pointer flex items-center justify-center gap-2">
                <span>🚨</span> TRIGGER SOS ALERT
            </button>
            <p id="sosStatus" class="text-xs text-slate-400 mt-2">Click to broadcast live location to contacts.</p>
        </div>

        <!-- Quick Actions Grid -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <button onclick="triggerFakeCall()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-2xl text-center transition cursor-pointer">
                <div class="text-2xl mb-1">📞</div>
                <div class="text-sm font-semibold text-slate-200">Fake Call</div>
            </button>
            <button onclick="shareLocation()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-2xl text-center transition cursor-pointer">
                <div class="text-2xl mb-1">📍</div>
                <div class="text-sm font-semibold text-slate-200">Share Live GPS</div>
            </button>
        </div>

        <!-- Emergency Contacts Section -->
        <div>
            <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3">Emergency Contacts</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="contactInput" placeholder="Name & Phone..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-rose-500 transition">
                <button onclick="addContact()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition cursor-pointer">Add</button>
            </div>
            <ul id="contactList" class="space-y-2 max-h-36 overflow-y-auto pr-1 text-sm">
                <!-- Default safety helplines -->
                <li class="bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl flex justify-between items-center text-slate-300">
                    <span>Women Helpline: 1091</span>
                    <span class="text-rose-400 text-xs font-semibold">Priority</span>
                </li>
            </ul>
        </div>
    </div>

    <!-- Fake Call Overlay (Hidden by default) -->
    <div id="fakeCallScreen" class="fixed inset-0 bg-slate-950 flex flex-col items-center justify-center hidden z-50 p-6">
        <div class="text-center animate-pulse mb-12">
            <p class="text-slate-400 text-sm uppercase tracking-widest mb-2">Incoming Call</p>
            <h2 class="text-4xl font-bold text-white mb-1">Mom ❤️</h2>
            <p class="text-emerald-400 text-sm">Mobile...</p>
        </div>
        <div class="flex gap-8">
            <button onclick="endFakeCall()" class="bg-rose-600 hover:bg-rose-500 text-white w-16 h-16 rounded-full flex items-center justify-center text-2xl shadow-lg cursor-pointer">✕</button>
            <button onclick="endFakeCall()" class="bg-emerald-600 hover:bg-emerald-500 text-white w-16 h-16 rounded-full flex items-center justify-center text-2xl shadow-lg cursor-pointer">📞</button>
        </div>
    </div>

    <script>
        // SOS Trigger Logic
        function triggerSOS() {
            const status = document.getElementById('sosStatus');
            status.innerText = "Fetching GPS location...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapLink = `https://maps.google.com/?q=${lat},${lon}`;
                    status.innerHTML = `<span class="text-rose-400 font-medium">SOS Sent! Location: <a href="${mapLink}" target="_blank" class="underline">View Map</a></span>`;
                    alert(`Emergency SOS Triggered!\nCoordinates: ${lat}, ${lon}`);
                }, () => {
                    status.innerText = "Error: Location access denied or unavailable.";
                });
            } else {
                status.innerText = "Geolocation is not supported by your browser.";
            }
        }

        // Fake Call Simulator
        function triggerFakeCall() {
            document.getElementById('fakeCallScreen').classList.remove('hidden');
        }

        function endFakeCall() {
            document.getElementById('fakeCallScreen').classList.add('hidden');
        }

        // Share Location Function
        function shareLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const mapLink = `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`;
                    navigator.clipboard.writeText(mapLink);
                    alert("Live location link copied to clipboard!");
                });
            } else {
                alert("Geolocation not supported.");
            }
        }

        // Add Emergency Contact
        function addContact() {
            const input = document.getElementById('contactInput');
            if (!input.value.trim()) return;

            const li = document.createElement('li');
            li.className = "bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl flex justify-between items-center text-slate-200";
            li.innerHTML = `<span>${input.value}</span> <button onclick="this.parentElement.remove()" class="text-rose-400 hover:text-rose-300 text-xs cursor-pointer">Delete</button>`;
            
            document.getElementById('contactList').appendChild(li);
            input.value = '';
        }
    </script>
</body>
</html>
